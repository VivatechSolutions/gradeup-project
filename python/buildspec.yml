version: 0.2

# No application secrets here on purpose. The image must not contain a .env:
# scripts/start_application.sh writes one on the EC2 host from Secrets Manager
# at deploy time and docker-compose passes it in via env_file. A copy baked into
# the image would shadow those values (core/secrets_manager.py) and be published
# to the registry with every build.
env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /Resumeparse-AI-CICD/Docker-credentials/username
    DOCKER_REGISTRY_PASSWORD: /Resumeparse-AI-CICD/Docker-credentials/password
    DOCKER_REGISTRY_URL: /Resumeparse-AI-CICD/Docker-registry/url

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Upgrading pip..."
      - pip install --upgrade pip

  pre_build:
    commands:
      - echo "Dependencies and file check..."
      - test -f Dockerfile
      - test -f docker-compose.yml
      - test -f appspec.yml
      - test -f scripts/start_application.sh
      - test -f scripts/stop_application.sh
      - test -f searxng/settings.yml
      - pip --version
      - ls -l # List files to verify location
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Build and Docker login..."
      - echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY_URL" -u "$DOCKER_REGISTRY_USERNAME" --password-stdin
      - echo "Building Docker image..."
      - docker build -t "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/gradeup-new:latest" .
      - docker push "$DOCKER_REGISTRY_URL/$DOCKER_REGISTRY_USERNAME/gradeup-new:latest"

  post_build:
    commands:
      - echo "Build completed successfully!"
artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - Dockerfile
    - requirements.txt
    - docker-compose.yml
    - searxng/**/*
  discard-paths: no